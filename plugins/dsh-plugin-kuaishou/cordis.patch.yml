# dsh-plugin-kuaishou 的 bundle 补丁。
#
# 这个文件由 profile 的 `dsh.profile.bundles` 装配，属于 **bundle 层**；
# 设置页写入的是更上层的 user 层，所以这里必须**不写 config**——
# 只要这里给了显式 config，DSH 会认为该命名空间被覆盖，`settings/update` 直接拒绝：
#   "Configuration for \"kuaishou\" is overridden by a home patch or command-line overlay"
#
# 默认值全部来自 index.js 导出的 Config schema（schemastery 的 .default()）。
# entry id 必须正好是 `kuaishou` —— DSH 的 settings 命名空间由 entry id 推导。
- insert:
    - id: kuaishou
      name: dsh-plugin-kuaishou
